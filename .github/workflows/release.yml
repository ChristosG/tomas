# Builds a signed release APK whenever a version tag is pushed (v0.2, v1.0, ...) and attaches it
# to a GitHub Release, so the family can download and install it from the Releases page.
#
# Release assets do not count against the free plan's storage quota; only the build minutes do
# (a build takes roughly 8-10 minutes). Nothing is uploaded as a workflow artifact on purpose.
#
# Signing: the keystore lives in the repository secrets (see README.md, "Releases"). Without the
# secrets the build still succeeds but is signed with the debug key, which is fine for testing and
# NOT for updating a phone that already has a release build.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from the tag
        id: version
        run: |
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Restore the signing keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        env:
          DIMITRIS_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          DIMITRIS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DIMITRIS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DIMITRIS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon -q :app:assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}
          cp app/build/outputs/apk/release/app-release.apk "dimitris-app-${{ steps.version.outputs.name }}.apk"

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Dimitris' App ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: dimitris-app-${{ steps.version.outputs.name }}.apk
